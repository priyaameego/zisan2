<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ztGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171B40"/>
      <stop offset="50%" stop-color="#1E2A5E"/>
      <stop offset="100%" stop-color="#0E1230"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#36BCE5"/>
      <stop offset="100%" stop-color="#1494BD"/>
    </linearGradient>
  </defs>
  <!-- Background Circle with Soft Border -->
  <rect width="64" height="64" rx="16" fill="url(#ztGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#36BCE5" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Circular Accent Arc -->
  <circle cx="32" cy="32" r="22" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="80 30" stroke-linecap="round"/>
  <!-- ZT Monogram -->
  <text x="32" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">ZT</text>
  <!-- Micro Star / Spark -->
  <circle cx="46" cy="18" r="3" fill="#36BCE5"/>
</svg>
